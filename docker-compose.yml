services:
  awgp-audiobook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: awgp-pipeline
    restart: unless-stopped
    ports:
      - "80:8000"
    volumes:
      - ./projects:/app/projects
      - ./audiobook_pipeline.db:/app/audiobook_pipeline.db
    env_file:
      - .env
    environment:
      - PORT=8000
      - PROJECTS_DIR=/app/projects
